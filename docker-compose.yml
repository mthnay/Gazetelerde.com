# Uygulama + PostgreSQL'i tek komutla çalıştırmak için (kendi sunucunuzda veya yerelde):
#   cp .env.example .env.production   # değerleri doldurun
#   docker compose up -d --build
#   docker compose exec app node prisma/seed.mjs   # ilk kurulumda örnek veri + admin
#
# Kendi PostgreSQL sunucunuzu kullanacaksanız "db" servisini silip
# .env.production içindeki DATABASE_URL'i o sunucuya yönlendirin.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: gazetelerde
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanımlayın}
      POSTGRES_DB: gazetelerde
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gazetelerde"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://gazetelerde:${POSTGRES_PASSWORD}@db:5432/gazetelerde
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
