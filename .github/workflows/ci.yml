name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Build sırasında ana sayfa veritabanından üretildiği için geçici bir PostgreSQL açılır
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gazetelerde_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gazetelerde_ci
      ADMIN_EMAIL: ci-admin@example.test
      ADMIN_PASSWORD: ci-only-password
      NEXT_PUBLIC_SITE_URL: https://example.test
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Birim testleri
        run: npm test

      - name: Veritabanı şeması
        run: npx prisma migrate deploy

      - name: Örnek veri
        run: node prisma/seed.mjs

      - name: Build
        run: npm run build

      - name: Duman testi (sunucu ayağa kalkıyor mu?)
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
          curl -sf http://localhost:3000/ > /dev/null
          curl -sf http://localhost:3000/sitemap.xml | grep -q "<urlset"
          curl -sf http://localhost:3000/rss.xml | grep -q "<rss"
          echo "Duman testi geçti"
